<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Ritual - Home</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: "Dancing Script", cursive;
            background-color: #f8f6f7;
        }
        nav {
            background-color: #4E0A0B;
            color: white;
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav .logo {
            font-family: "Dancing Script", cursive;
        font-size: 32px;
        color: #f8f6f7;
        font-weight: bold;
            
        }

        nav .nav-right {
            display: flex;
            align-items: center;
        }

        

        /* Login Button */
        .signin-btn {
            padding: 8px 20px;
            background-color: #f0dddd;
            color: #4E0A0B;
            border: #4E0A0B;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.3s;
        }

        .signin-btn:hover {
            background-color: #440c0c;
            color: #FFFFFF;
        }

        /* Hero Section */
        .hero {
            height: 80vh;
            background-image: url("1.jpeg");
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            color: #fffaf0; 
            padding-top: 30px;
            border-radius: 20px;
        }

        .hero::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4); 
            z-index: 0;
        }

        .hero h1, .hero p {
            position: relative;
            z-index: 1; 
        }

        .hero h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 80px;
            margin: 0;
        }

        .hero p {
            font-size: 22px;
            margin-top: 10px;
        }

        /* Sections */
        .sections {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin: 50px 20px;
            gap: 20px;
        }

        .section-card {
            width: 300px;
            border-radius: 15px;
            overflow: hidden;
            text-align: center;
            background-color: #fff;
            box-shadow: 0px 0px 15px #dcdcdc;
            transition: transform 0.3s;
        }

        .section-card:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgb(78, 10, 11);
        }

        .section-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .section-card h3 {
            margin: 15px 0;
            font-size: 22px;
            color: #4d0d0d;
        }

        .section-card a {
            display: inline-block;
            margin-bottom: 15px;
            text-decoration: none;
            color: #4d0d0d;
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 1000px) {
            .sections {
                justify-content: center;
            }
        }

        @media (max-width: 650px) {
            .hero h1 {
                font-size: 50px;
            }

            .hero p {
                font-size: 18px;
            }

            .section-card {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo" style="font-family: 'Dancing Script', cursive; font-size: 32px; color: #f8f6f7; ">Glow Ritual</div>
        <div class="nav-right">
            <button class="signin-btn" onclick="window.location.href='signin.html'">Signin</button>
            
        </div>
    </nav>

    
    <div class="hero">
        <h1>Glow Ritual</h1>
        <p>Welcome to your beauty sanctuary</p>
    </div>

    <div class="sections">
        <div class="section-card">
            <img src="2.jpeg" alt="Hair Care">
            <h3>Hair Care</h3>
            <a href="Hair.html">Explore</a>
        </div>
        <div class="section-card">
            <img src="3.jpeg" alt="Body Care">
            <h3>Body Care</h3>
            <a href="Body.html">Explore</a>
        </div>
        <div class="section-card">
            <img src="4.jpeg" alt="Skin Care">
            <h3>Skin Care</h3>
            <a href="Skin.html">Explore</a>
        </div>
    </div>
    <script>
        window.onload = function() {
            alert("Please login to continue!");
        }
        


    const simpleDate = new Date().toLocaleDateString();
    document.write(`
    <div style="
        text-align: center;
        padding: 10px;
        color: #4e0a0b;
        font-family: 'Poppins';
        font-size: 14px;
    ">
        Today: ${simpleDate}
    </div>
`);
    </script>
</body>
</html>
