<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Ritual - Reset Password</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background-color: #f5f5f5;
            font-family: 'Poppins', sans-serif;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .reset-box {
            width: 380px;
            padding: 40px 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .logo {
            font-family: 'Great Vibes', cursive;
            font-size: 46px;
            color: #4d0d0d;
            margin-bottom: 15px;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 25px;
            color: #4d0d0d;
        }

        p {
            font-size: 14px;
            color: #4d0d0d;
            margin-bottom: 20px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            font-size: 14px;
            color: #4d0d0d;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid #dcdcdc;
            outline: none;
            font-size: 14px;
            transition: border 0.3s;
        }

        input:focus {
            border-color: #4d0d0d;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: #4d0d0d;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        .btn:hover {
            background-color: #7a1a1a;
            transform: translateY(-2px);
        }

        .help-links {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            font-size: 13px;
        }

        .help-links a {
            color: #4d0d0d;
            text-decoration: none;
        }

        .help-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 450px) {
            .reset-box {
                width: 90%;
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="reset-box">
            <div class="logo">Glow Ritual</div>
            <h2>Reset Your Password</h2>
            <p>Enter your email address below and we'll send you a code to reset your password.</p>

            <form id="resetForm">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>

                <button type="submit" class="btn">Send Reset code</button>
            </form>

            <div class="help-links">
                <a href="signin.html">← Back to Sign In</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("resetForm").addEventListener("submit", function(event){
            event.preventDefault();
            alert("If this email exists in our system, a password reset code has been sent!");
            window.location.href = "code.html";
        });
    </script>

</body>
</html>
